
<!DOCTYPE html>

<head>

    <header>

        <img

            src="https://picsum.photos/seed/lazyplace2/400/650"

            height="650"

        <img
            src="https://picsum.photos/seed/lazyplace3/400/650"

            width="400"
            height="650"
            loading="lazy">

        <img
            src="https://picsum.photos/seed/lazyplace4/400/650"
            alt="Peaceful landscape surrounded by nature"
            width="400"
            height="650"
            loading="lazy">

        <img
            src="https://picsum.photos/seed/lazyplace5/400/650"
            alt="Amazing natural scenery and landscape"
            width="400"
            height="650"
            loading="lazy">

        <img
            src="https://picsum.photos/seed/lazyplace6/400/650"

            height="650"

    </main>
